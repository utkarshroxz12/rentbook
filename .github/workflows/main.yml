name: Build RentBook IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rentbook-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Check rent calculations
        run: |
          swiftc -swift-version 5 -parse-as-library Core*.swift RentBookTests.swift -o rentbook-tests
          ./rentbook-tests

      - name: Create Xcode project
        run: |
          brew install xcodegen
          mkdir -p App
          for f in ./*.swift; do
            case "$f" in
              *Tests.swift) ;;
              *) cp "$f" App/ ;;
            esac
          done
          cat > project.yml <<'EOF'
          name: RentBook
          targets:
            RentBook:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.rentbook.app
                  PRODUCT_NAME: RentBook
                  MARKETING_VERSION: "2.0"
                  CURRENT_PROJECT_VERSION: "${{ github.run_number }}"
                  GENERATE_INFOPLIST_FILE: "YES"
                  INFOPLIST_KEY_CFBundleDisplayName: RentBook
                  INFOPLIST_KEY_NSFaceIDUsageDescription: "RentBook uses Face ID to keep your rent records private."
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild -quiet -project RentBook.xcodeproj -target RentBook \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RentBook.app Payload/
          zip -qry RentBook.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RentBook-ipa
          path: RentBook.ipa
